    kind: wrfchem_species
    wrf_names: [SULFATE, SO4, so4, ASO4I, ASO4J]
    units: ug/m3
    aggregation: daily_mean
    readiness: designable_with_gap
    postprocess:
      status: missing
      variable_key: SULFATE
      output_name: sulfate
      wrf_names: [SULFATE, SO4, so4, ASO4I, ASO4J]
      units: ug/m3
      aggregation: daily_mean
      gap_reason: missing_postprocess_extractor
    collector:
      status: missing
      output_aliases: [SULFATE, SO4]
      field_aliases: []
      gap_reason: missing_collector_alias

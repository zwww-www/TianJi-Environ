suite:
  id: simple_analysis_realdata_taskbench
  version: '0.1'
  evidence_role: simple_analysis_task_benchmark
  artifact_boundary: benchmark_or_presentation_artifact_only
  requires_wrfchem_execution: false
  requires_tianhe_access: false
  requires_ssh: false
  requires_remote_postprocessing: false
  requires_large_netcdf: false
  output_root: outputs/simple_analysis_real
task_families:
- task_family_id: SA-01
  title: Real-data MDA8 O3 peak-process identification
  category: simple_analysis
  task_type: mda8_peak_process
  plot_family: mda8_peak_spatial_map
  required_columns:
  - timestamp
  - location
  - lon
  - lat
  - o3_ppbv
  expected_artifacts:
  - json_score
  - markdown_report
  - png_figure
  cases:
  - case_id: SA-01-real-openmeteo-prd-o3-peak
    split: heldout
    question: Identify the strongest MDA8 O3 process from real hourly O3 data.
    fixtures:
    - role: hourly_o3_table
      path: data/processed/simple_analysis_real/fixtures/hourly_o3/sa01_real_openmeteo_prd_o3.csv
    ir:
      version: 1
      analysis_type: temporal_spatial_peak
      dataset_role: hourly_o3_table
      columns:
        time: timestamp
        location: location
        lon: lon
        lat: lat
      variables:
        o3:
          column: o3_ppbv
          units: ppbv
          role: endpoint
      operators:
      - name: temporal_metric
        variable: o3
        metric: mda8
        output_key: mda8_ppbv
      - name: spatial_field
        field: mda8_ppbv
      - name: ranking_extrema
        field: mda8_ppbv
        mode: maximum
      figure_recipe:
        plot_family: mda8_peak_spatial_map
        panel_count: 1
        spatial: true
        field: mda8_ppbv
        outline: none
      report_recipe:
        style: researcher_compact
      scoring_expectations:
      - temporal_metric
      - peak_localization
      - spatial_field
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: real_openmeteo_prd
        axis: hourly_o3
  - case_id: SA-01-real-openmeteo-prd-o3-peak-dev
    split: dev
    question: Development mirror for the real hourly O3 MDA8 peak task.
    fixtures:
    - role: hourly_o3_table
      path: data/processed/simple_analysis_real/fixtures/hourly_o3/sa01_real_openmeteo_prd_o3.csv
    ir:
      version: 1
      analysis_type: temporal_spatial_peak
      dataset_role: hourly_o3_table
      columns:
        time: timestamp
        location: location
        lon: lon
        lat: lat
      variables:
        o3:
          column: o3_ppbv
          units: ppbv
          role: endpoint
      operators:
      - name: temporal_metric
        variable: o3
        metric: mda8
        output_key: mda8_ppbv
      - name: spatial_field
        field: mda8_ppbv
      - name: ranking_extrema
        field: mda8_ppbv
        mode: maximum
      figure_recipe:
        plot_family: mda8_peak_spatial_map
        panel_count: 1
        spatial: true
        field: mda8_ppbv
        outline: none
      report_recipe:
        style: researcher_compact
      scoring_expectations:
      - temporal_metric
      - peak_localization
      - spatial_field
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: real_openmeteo_prd
        axis: hourly_o3
- task_family_id: SA-03
  title: Real-data PRD MDA8 O3 branch-delta analysis
  category: simple_analysis
  task_type: control_treatment_o3_delta
  plot_family: mda8_delta_spatial_map
  required_columns:
  - timestamp
  - location
  - lon
  - lat
  - branch
  - o3_ppbv
  expected_artifacts:
  - json_score
  - markdown_report
  - png_figure
  cases:
  - case_id: SA-03-real-openmeteo-prd-mda8-delta
    split: heldout
    question: Analyze treatment minus control MDA8 O3 branch differences over the
      Pearl River Delta.
    fixtures:
    - role: branch_o3_table
      path: data/processed/simple_analysis_real/fixtures/branch_o3/sa03_real_openmeteo_prd_mda8_delta.csv
    ir:
      version: 1
      analysis_type: branch_spatial_delta
      dataset_role: branch_o3_table
      columns:
        time: timestamp
        location: location
        lon: lon
        lat: lat
        branch: branch
      branch_mapping:
        baseline: control
        scenario: treatment
      variables:
        o3:
          column: o3_ppbv
          units: ppbv
          role: endpoint
          delta_key: delta_mda8_ppbv
      operators:
      - name: branch_contrast
        metric: mda8
        variables:
        - o3
      - name: spatial_field
        field: delta_mda8_ppbv
      - name: ranking_extrema
        field: delta_mda8_ppbv
        mode: minmax
      figure_recipe:
        plot_family: mda8_delta_spatial_map
        panel_count: 1
        spatial: true
        field: delta_mda8_ppbv
        diverging: true
        outline: none
      report_recipe:
        style: researcher_compact
      scoring_expectations:
      - branch_contrast
      - extrema_localization
      - spatial_delta
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: real_openmeteo_prd_branch_delta
        axis: control_treatment_mda8_delta
  - case_id: SA-03-real-openmeteo-prd-mda8-delta-dev

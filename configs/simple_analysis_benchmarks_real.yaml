- task_family_id: SA-08
  title: Wet-scavenging sulfate evidence and claim-boundary check
  category: simple_analysis
  task_type: wet_scavenging_sulfate_boundary
  plot_family: sulfate_wet_spatial_evidence
  required_columns:
  - location
  - lon
  - lat
  - branch
  - so4_ugm3
  - rainnc_mm
  - wetdep_proxy
  expected_artifacts:
  - json_score
  - markdown_report
  - png_figure
  cases:
  - case_id: SA-08-dev-sulfate-wet
    split: dev
    question: Check whether sulfate decrease is supported by wet-scavenging evidence.
    fixtures:
    - role: sulfate_wet_removal_table
      path: tests/fixtures/simple_analysis/sulfate/sa08_dev_sulfate_wet.csv
    ir:
      version: 1
      analysis_type: evidence_boundary
      dataset_role: sulfate_wet_removal_table
      columns: &id001
        location: location
        lon: lon
        lat: lat
        branch: branch
      branch_mapping: &id002
        baseline: control
        scenario: treatment
      variables: &id003
        so4:
          column: so4_ugm3
          units: ug m-3
          role: endpoint
          delta_key: delta_so4_ugm3
        rain:
          column: rainnc_mm
          units: mm
          role: diagnostic
          delta_key: delta_rainnc_mm
        wetdep:
          column: wetdep_proxy
          units: proxy
          role: diagnostic
          delta_key: delta_wetdep_proxy
      operators: &id004
      - name: branch_contrast
        metric: mean
        variables:
        - so4
        - rain
        - wetdep
      - name: evidence_boundary
        endpoint: so4
        mechanism_variables:
        - rain
        - wetdep
      - name: spatial_field
        fields:
        - delta_so4_ugm3
        - delta_wetdep_proxy
      figure_recipe: &id005
        plot_family: sulfate_wet_spatial_evidence
        panel_count: 2
        spatial: true
        fields:
        - delta_so4_ugm3
        - delta_wetdep_proxy
        outline: none
      report_recipe: &id006
        style: researcher_compact
      scoring_expectations: &id007
      - endpoint_delta
      - evidence_boundary
      - next_evidence
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: baseline
        axis: complete_wet_evidence
  - case_id: SA-08-heldout-sulfate-boundary
    split: heldout
    question: Bound claims when sulfate decreases but wet-scavenging evidence is incomplete.
    fixtures:
    - role: sulfate_wet_removal_table
      path: tests/fixtures/simple_analysis/sulfate/sa08_heldout_sulfate_wet.csv
    ir:
      version: 1
      analysis_type: evidence_boundary
      dataset_role: sulfate_wet_removal_table
      columns: *id001
      branch_mapping: *id002
      variables: *id003
      operators: *id004
      figure_recipe: *id005
      report_recipe: *id006
      scoring_expectations: *id007
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: diagnostic_completeness_variant
        axis: wetdep_and_rain_missing
  - case_id: SA-08-heldout-rain-only-boundary
    split: heldout
    question: Bound sulfate wet-scavenging claims when rainfall exists but wet-deposition
      proxy is missing.
    fixtures:
    - role: sulfate_wet_removal_table
      path: tests/fixtures/simple_analysis/sulfate/sa08_heldout_rain_only_boundary.csv
    ir:
      version: 1
      analysis_type: evidence_boundary
      dataset_role: sulfate_wet_removal_table
      columns: *id001
      branch_mapping: *id002
      variables: *id003
      operators: *id004
      figure_recipe: *id005
      report_recipe: *id006
      scoring_expectations: *id007
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: diagnostic_completeness_variant
        axis: rain_available_wetdep_missing

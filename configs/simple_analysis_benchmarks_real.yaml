- task_family_id: SA-05
  title: Real-data O3-meteorology mechanism-chain quick diagnosis
  category: simple_analysis
  task_type: uhi_o3_mechanism_chain
  plot_family: uhi_o3_spatial_mechanism_panels
  required_columns:
  - location
  - lon
  - lat
  - branch
  - o3_ppbv
  - t2_k
  - pblh_m
  - swdown_wm2
  expected_artifacts:
  - json_score
  - markdown_report
  - png_figure
  cases:
  - case_id: SA-05-real-openmeteo-o3-meteo-chain
    split: heldout
    question: Diagnose whether real O3 and meteorological differences form a bounded
      mechanism chain.
    fixtures:
    - role: mechanism_diagnostic_table
      path: data/processed/simple_analysis_real/fixtures/mechanism/sa05_real_openmeteo_o3_meteo.csv
    ir:
      version: 1
      analysis_type: mechanism_chain
      dataset_role: mechanism_diagnostic_table
      columns:
        location: location
        lon: lon
        lat: lat
        branch: branch
      branch_mapping:
        baseline: control
        scenario: treatment
      variables:
        o3:
          column: o3_ppbv
          units: ppbv
          role: endpoint
          delta_key: delta_o3_ppbv
        t2:
          column: t2_k
          units: K
          role: diagnostic
          delta_key: delta_t2_k
        pblh:
          column: pblh_m
          units: m
          role: diagnostic
          delta_key: delta_pblh_m
        swdown:
          column: swdown_wm2
          units: W m-2
          role: diagnostic
          delta_key: delta_swdown_wm2
      operators:
      - name: branch_contrast
        metric: mean
        variables:
        - o3
        - t2
        - pblh
        - swdown
      - name: mechanism_chain
        endpoint: o3
        expectations: {}
        mechanism_label: real O3-meteorology mechanism-chain
        next_evidence_needed: Add precursor, transport, and observation uncertainty
          diagnostics.
      - name: spatial_field
        fields:
        - delta_o3_ppbv
        - delta_t2_k
        - delta_pblh_m
        - delta_swdown_wm2
      figure_recipe:
        plot_family: uhi_o3_spatial_mechanism_panels
        panel_count: 4
        spatial: true
        fields:
        - delta_o3_ppbv
        - delta_t2_k
        - delta_pblh_m
        - delta_swdown_wm2
        diverging: true
        outline: none
      report_recipe:
        style: researcher_compact
      scoring_expectations:
      - branch_contrast
      - mechanism_chain
      - bounded_interpretation
      artifact_boundary: benchmark_or_presentation_artifact_only
      variant:
        kind: real_openmeteo_o3_meteo
        axis: event_vs_reference
  - case_id: SA-05-real-openmeteo-o3-meteo-chain-dev

      dataset_role: branch_o3_table
      columns:
        time: timestamp
        location: location
        lon: lon
        lat: lat
        branch: branch
      branch_mapping:
        baseline: control
        scenario: treatment
      variables:
        o3:
          column: o3_ppbv
          units: ppbv
          role: endpoint
          delta_key: delta_mda8_ppbv
      operators:
      - name: branch_contrast
        metric: mda8
        variables:
        - o3
      - name: spatial_field
        field: delta_mda8_ppbv
      - name: ranking_extrema
        field: delta_mda8_ppbv
        mode: minmax
      figure_recipe:
        plot_family: mda8_delta_spatial_map
        panel_count: 1
        spatial: true
        field: delta_mda8_ppbv
        diverging: true
        outline: none
      report_recipe:
        style: researcher_compact
      scoring_expectations:
      - branch_contrast
